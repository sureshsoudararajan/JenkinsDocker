name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: suresh45808/jenkins-docker-demo

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} .

          docker tag \
            ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} \
            ${{ env.DOCKER_IMAGE }}:latest

      # 3. Test the image
      - name: Test Image
        run: |
          docker image inspect \
            ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Push images to Docker Hub
      - name: Push Image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

      # 6. Pull and run the image
      - name: Pull and Run the Image
        run: |
          docker rm -f DockerCheckProd || true

          docker pull ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}

          docker run -d \
            --name DockerCheckProd \
            -p 80:80 \
            ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}

      # 7. Verify the container is running
      - name: Verify Container
        run: |
          docker ps --filter name=DockerCheckProd
          docker logs DockerCheckProd

      # 8. Clean up
      - name: Cleanup
        if: always()
        run: |
          docker rm -f DockerCheckProd || true
          docker logout || true
