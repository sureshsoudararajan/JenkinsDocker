name: sample file

on:
  - push
  - workflow_dispatch

jobs:
  print-files:
    runs-on: ubuntu-latest
    steps:
      - name: print cwd files
        run: ls -la

  present-working-dir:
    runs-on: ubuntu-latest
    steps:
      - name: print current dir and username
        run: |
          pwd
          whoami
